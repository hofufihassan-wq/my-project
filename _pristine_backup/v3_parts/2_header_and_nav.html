<div id="app" v-cloak class="min-h-screen flex flex-col relative overflow-x-hidden">

  <!-- Ambient Glowing Background Accents -->
  <div class="fixed top-0 left-1/2 -translate-x-1/2 w-[1100px] h-[360px] bg-gradient-to-b from-[#00DC82]/15 via-[#00DC82]/5 to-transparent blur-3xl pointer-events-none -z-10 animate-nuxt-pulse"></div>
  <div class="fixed -bottom-40 -right-40 w-96 h-96 bg-[#064E3B]/25 blur-[130px] rounded-full pointer-events-none -z-10"></div>
  <div class="fixed -top-40 -left-40 w-96 h-96 bg-[#0F172A] blur-[120px] rounded-full pointer-events-none -z-10"></div>

  <!-- Toast Notification System -->
  <transition
    enter-active-class="transition duration-300 ease-out"
    enter-from-class="transform translate-y-4 opacity-0 scale-95"
    enter-to-class="transform translate-y-0 opacity-100 scale-100"
    leave-active-class="transition duration-200 ease-in"
    leave-from-class="transform translate-y-0 opacity-100 scale-100"
    leave-to-class="transform translate-y-4 opacity-0 scale-95"
  >
    <div
      v-if="toastVisible"
      class="fixed bottom-6 left-6 z-50 flex items-center gap-3 px-5 py-3 rounded-2xl bg-[#081022] border-2 border-[#00DC82] shadow-2xl text-white text-xs font-semibold backdrop-blur-xl"
    >
      <span class="w-2.5 h-2.5 rounded-full bg-[#00DC82] animate-ping"></span>
      <span>{{ toastMessage }}</span>
    </div>
  </transition>

  <!-- ==================================================== -->
  <!-- 1. HEADER (الترويسة الاحترافية وشعار Nuxt UI & Vue) -->
  <!-- ==================================================== -->
  <header class="sticky top-0 z-40 w-full border-b border-[#1e332c]/80 bg-[#020420]/85 backdrop-blur-xl transition-all">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between gap-4">
      
      <!-- Brand & Integrated SVG Logo -->
      <div class="flex items-center gap-3 cursor-pointer select-none" @click="setAppMode('lexicon')">
        <div class="relative w-11 h-11 flex items-center justify-center rounded-2xl bg-gradient-to-br from-[#064E3B] to-[#020420] border-2 border-[#00DC82]/60 shadow-lg shadow-[#00DC82]/20 hover:scale-105 transition-transform">
          <svg class="w-7 h-7" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M78.8 10L64 35.6L49.2 10H0L64 121L128 10H78.8Z" fill="#00DC82" fill-opacity="0.9"/>
            <path d="M78.8 10L64 35.6L49.2 10H25.6L64 76.6L102.4 10H78.8Z" fill="#064E3B"/>
            <path d="M64 48L51 70H77L64 48Z" fill="#020420"/>
            <text x="64" y="96" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="900" fill="#00DC82" text-anchor="middle">&lt;V/&gt;</text>
          </svg>
          <div class="absolute -bottom-1 -right-1 w-3.5 h-3.5 bg-[#00DC82] rounded-full border-2 border-[#020420]"></div>
        </div>

        <div>
          <div class="flex items-center gap-2">
            <h1 class="text-xl sm:text-2xl font-black tracking-tight text-white flex items-center gap-1">
              <span>VueLexicon</span>
              <span class="text-[#00DC82]">Pro</span>
            </h1>
            <span class="text-[10px] font-mono px-2 py-0.5 rounded-full bg-[#00DC82]/15 text-[#00DC82] border border-[#00DC82]/40 font-bold">
              v3.2
            </span>
          </div>
          <p class="text-[11px] text-gray-400 font-medium hidden sm:block">
            المترجم والمعجم ومستشار Nuxt UI v3 ومختبر الأكواد الحي
          </p>
        </div>
      </div>

      <!-- App Mode Switcher Navigation Pills -->
      <nav class="hidden md:flex items-center p-1 rounded-2xl bg-[#081022] border border-[#1e332c] text-xs font-semibold">
        <button
          @click="setAppMode('lexicon')"
          :class="appMode === 'lexicon' ? 'bg-[#00DC82] text-slate-950 font-bold shadow-md shadow-[#00DC82]/20' : 'text-gray-300 hover:text-white hover:bg-slate-800/60'"
          class="px-4 py-2 rounded-xl transition-all flex items-center gap-1.5"
        >
          <span>📖</span>
          <span>المعجم الشامل</span>
          <span class="text-[10px] font-mono opacity-80">(160)</span>
        </button>

        <button
          @click="setAppMode('nuxt-lab')"
          :class="appMode === 'nuxt-lab' ? 'bg-[#00DC82] text-slate-950 font-bold shadow-md shadow-[#00DC82]/20' : 'text-gray-300 hover:text-white hover:bg-slate-800/60'"
          class="px-4 py-2 rounded-xl transition-all flex items-center gap-1.5"
        >
          <span>🧪</span>
          <span>معمل Nuxt UI</span>
          <span class="text-[10px] px-1.5 py-0.2 rounded bg-emerald-950 text-[#00DC82] font-mono">v3</span>
        </button>

        <button
          @click="setAppMode('scratchpad')"
          :class="appMode === 'scratchpad' ? 'bg-[#00DC82] text-slate-950 font-bold shadow-md shadow-[#00DC82]/20' : 'text-gray-300 hover:text-white hover:bg-slate-800/60'"
          class="px-4 py-2 rounded-xl transition-all flex items-center gap-1.5"
        >
          <span>⚡</span>
          <span>المحرر التجريبي</span>
          <span class="w-2 h-2 rounded-full bg-[#00DC82] animate-pulse"></span>
        </button>

        <button
          @click="setAppMode('quiz')"
          :class="appMode === 'quiz' ? 'bg-[#00DC82] text-slate-950 font-bold shadow-md shadow-[#00DC82]/20' : 'text-gray-300 hover:text-white hover:bg-slate-800/60'"
          class="px-4 py-2 rounded-xl transition-all flex items-center gap-1.5"
        >
          <span>🎯</span>
          <span>تحدي المطورين</span>
        </button>
      </nav>

      <!-- Quick Action Controls -->
      <div class="flex items-center gap-2">
        <!-- Bookmark Counter Pill -->
        <button
          @click="setCategory('bookmarks')"
          :class="activeCategory === 'bookmarks' && appMode === 'lexicon' ? 'bg-amber-400 text-slate-950 font-bold' : 'bg-[#081022] text-amber-400 border border-amber-400/30 hover:border-amber-400'"
          class="px-3 py-1.5 rounded-xl text-xs flex items-center gap-1.5 transition-all shadow-sm"
          title="عرض المفضلة"
        >
          <span>★</span>
          <span class="font-mono font-bold">{{ bookmarkedIds.size }}</span>
        </button>

        <!-- Keyboard Shortcuts Opener -->
        <button
          @click="showShortcutsModal = true"
          class="p-2 rounded-xl bg-[#081022] border border-[#1e332c] text-gray-400 hover:text-white hover:border-[#00DC82]/50 transition-all text-xs"
          title="اختصارات لوحة المفاتيح"
        >
          ⌨
        </button>
      </div>

    </div>

    <!-- Mobile Navigation Bar -->
    <div class="md:hidden flex items-center justify-around px-2 py-2 border-t border-[#1e332c]/50 bg-[#081022] text-xs">
      <button @click="setAppMode('lexicon')" :class="appMode === 'lexicon' ? 'text-[#00DC82] font-bold' : 'text-gray-400'" class="p-1.5 flex flex-col items-center">
        <span>📖</span>
        <span class="text-[11px]">المعجم</span>
      </button>
      <button @click="setAppMode('nuxt-lab')" :class="appMode === 'nuxt-lab' ? 'text-[#00DC82] font-bold' : 'text-gray-400'" class="p-1.5 flex flex-col items-center">
        <span>🧪</span>
        <span class="text-[11px]">معمل Nuxt</span>
      </button>
      <button @click="setAppMode('scratchpad')" :class="appMode === 'scratchpad' ? 'text-[#00DC82] font-bold' : 'text-gray-400'" class="p-1.5 flex flex-col items-center">
        <span>⚡</span>
        <span class="text-[11px]">المحرر الحي</span>
      </button>
      <button @click="setAppMode('quiz')" :class="appMode === 'quiz' ? 'text-[#00DC82] font-bold' : 'text-gray-400'" class="p-1.5 flex flex-col items-center">
        <span>🎯</span>
        <span class="text-[11px]">التحدي</span>
      </button>
    </div>
  </header>
